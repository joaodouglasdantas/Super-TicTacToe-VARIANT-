<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super TicTacToe</title>
    <meta
      name="description"
      content="Jogo da velha em tabuleiros aninhados. Jogue no mesmo aparelho ou online por código de sala. Ultimate tic-tac-toe in your browser."
    />
    <meta name="theme-color" content="#07041c" />
    <meta property="og:title" content="Super TicTacToe" />
    <meta
      property="og:description"
      content="Jogo da velha em tabuleiros aninhados: no mesmo aparelho ou online por código de sala."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joaodouglasdantas.github.io/Super-TicTacToe-VARIANT-/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carrega sem bloquear a renderização (media="print" até a folha
         carregar, depois vira "all"): se o Google Fonts estiver lento ou
         inacessível, o jogo continua interativo com a pilha de reserva
         (--font-title/--font-body em themes.css), sem travar o carregamento. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
